services:
  app:
    build: .
    container_name: bondrota-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy  # espera o postgres estar pronto
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: bondrota-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bondrota_db
    ports:
      - "5432:5432"
    volumes:
      - bondrota-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  bondrota-postgres-data: