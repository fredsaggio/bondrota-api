services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bondrota
      POSTGRES_PASSWORD: bondrota
      POSTGRES_DB: bondrota
    ports:
      - "5432:5432"
    volumes:
      - bondrota-postgres-data:/var/lib/postgresql/data

volumes:
  bondrota-postgres-data: