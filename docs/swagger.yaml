              type: number
              example: -9.7812
            longitude:
              type: number
              example: -36.3501
        destino_final:
          type: object
          required:
          - nome
          - latitude
          - longitude
          properties:
            nome:
              type: string
              example: Universidade Federal de Alagoas
            latitude:
              type: number
              example: -9.5584
            longitude:
              type: number
              example: -35.7777
        distancia_metros:
          type: integer
          example: 100000
        duracao_segundos:
          type: integer
          example: 5400
        geometry:
          type: object
          required:
          - type
          - coordinates
          properties:
            type:
              type: string
              example: LineString
            coordinates:
              type: array
              items:
                type: array
                items:
                  type: number
                minItems: 2
                maxItems: 2
              example:
              - - -36.3501
                - -9.7812
              - - -35.7777
                - -9.5584
        destinos:
          type: array
          items:
            type: object
            required:
            - destino_id
            properties:
              destino_id:
                type: integer
                example: 1
