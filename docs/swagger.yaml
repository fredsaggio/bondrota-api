openapi: 3.0.3
info:
  title: BondRota API
  description: Documentação completa da API BondRota para consumo do frontend, extraída
    de `docs/api-reference.md`.
  version: 1.0.0
servers:
- url: https://bondrota-api.onrender.com/api/v1
  description: Servidor de Produção
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminCookieAuth:
      type: apiKey
      in: cookie
      name: bondrota_admin_session
    planningCronAuth:
      type: http
      scheme: bearer
      description: Segredo interno configurado em PLANNING_CRON_SECRET
  schemas:
    LoginRequestEmail:
      type: object
      required:
      - email
      - senha
      properties:
        email:
          type: string
          example: admin@bondrota.com
        senha:
          type: string
          example: admin123
    LoginRequestCPF:
      type: object
      required:
      - cpf
      - senha
      properties:
        cpf:
          type: string
          example: '00000000000'
        senha:
          type: string
          example: senha123
    TokenResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...
    AdminSessionResponse:
      type: object
      required:
      - user_id
      - role
      - expires_at
      properties:
        user_id:
          type: integer
          format: int64
        role:
          type: string
          example: admin
        expires_at:
          type: integer
          format: int64
          description: Expiração da sessão em milissegundos desde o Unix epoch
    ResumoLimpezaResponse:
      type: object
      properties:
        corte:
          type: string
          format: date-time
          description: Data limite; tudo com data_viagem anterior foi removido.
          example: '2026-05-11T00:00:00-03:00'
        ciclos_removidos:
          type: integer
          format: int64
          example: 12
        reservas_removidas:
          type: integer
          format: int64
          example: 340
        execucoes_removidas:
          type: integer
          format: int64
          example: 24
        lote_saturado:
          type: boolean
          description: Indica que o limite do lote foi atingido e sobrou trabalho para a proxima execucao.
          example: false
    ConfigResponse:
      type: object
      properties:
        cidade_base:
          type: string
          example: Campo Alegre
        fuso_horario:
          type: string
          example: America/Maceio
    MunicipioResponse:
      type: object
      properties:
        codigo_ibge:
          type: integer
          format: int64
          example: 2704302
        nome:
          type: string
          example: Maceio
        uf:
          type: string
          example: AL
    AdminChangePasswordRequest:
      type: object
      required:
      - senha_atual
      - nova_senha
      properties:
        senha_atual:
          type: string
          example: senha-de-agora
        nova_senha:
          type: string
          minLength: 8
          example: senha-nova-com-8+
    AdminResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          example: admin@bondrota.com
    VeiculoCreateRequest:
      type: object
      required:
      - placa
      - modelo
      - categoria
      - capacidade
      - status
      properties:
        placa:
          type: string
          example: ABC1D23
        modelo:
          type: string
          example: Volare Escolar
        categoria:
          type: string
          enum:
          - executivo
          - escolar
          - carro_7_lugares
          example: escolar
        capacidade:
          type: integer
          example: 24
        status:
          type: string
          enum:
          - ativo
          - inativo
          - manutencao
          example: ativo
        ar_condicionado:
          type: boolean
          example: true
        banheiro:
          type: boolean
          example: false
        persiana:
          type: boolean
          example: false
        luz_leitura:
          type: boolean
          example: false
        tomada:
          type: boolean
          example: true
    VeiculoUpdateRequest:
      type: object
      properties:
        placa:
          type: string
          example: ABC1D23
        modelo:
          type: string
          example: Volare Escolar
        categoria:
          type: string
          enum:
          - executivo
          - escolar
          - carro_7_lugares
          example: escolar
        capacidade:
          type: integer
          example: 24
        status:
          type: string
          enum:
          - ativo
          - inativo
          - manutencao
          example: ativo
        ar_condicionado:
          type: boolean
          example: true
        banheiro:
          type: boolean
          example: false
        persiana:
          type: boolean
          example: false
        luz_leitura:
          type: boolean
          example: false
        tomada:
          type: boolean
          example: true
    VeiculoIDResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
    VeiculoResponse:
      allOf:
      - $ref: '#/components/schemas/VeiculoIDResponse'
      - $ref: '#/components/schemas/VeiculoCreateRequest'
    DestinoRequest:
      type: object
      required:
      - nome
      - rua
      - municipio_id
      - latitude
      - longitude
      properties:
        nome:
          type: string
          example: Universidade Federal de Alagoas
        rua:
          type: string
          example: Av. Lourival Melo Mota
        municipio_id:
          type: integer
          format: int64
          example: 2704302
        latitude:
          type: number
          example: -9.5584
        longitude:
          type: number
          example: -35.7777
    DestinoIDResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
    DestinoResponse:
      allOf:
      - $ref: '#/components/schemas/DestinoIDResponse'
      - $ref: '#/components/schemas/DestinoRequest'
    ParadaRequest:
      type: object
      required:
      - nome
      - latitude
      - longitude
      properties:
        nome:
          type: string
          example: Praca Central
        latitude:
          type: number
          example: -9.7812
        longitude:
          type: number
          example: -36.3501
    ParadaIDResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
    ParadaResponse:
      allOf:
      - $ref: '#/components/schemas/ParadaIDResponse'
      - $ref: '#/components/schemas/ParadaRequest'
    CreateRotaInternaRequest:
      type: object
      required:
      - paradas
      properties:
        paradas:
          type: array
          items:
            type: object
            required:
            - parada_id
            - ordem
            properties:
              parada_id:
                type: integer
                example: 1
              ordem:
                type: integer
                example: 1
    UpdateParadasRequest:
      type: object
      required:
      - paradas
      properties:
        paradas:
          type: array
          items:
            type: object
            required:
            - parada_id
            - ordem
            properties:
              parada_id:
                type: integer
                example: 1
              ordem:
                type: integer
                example: 1
    RotaInternaParada:
      allOf:
      - $ref: '#/components/schemas/ParadaResponse'
      - type: object
        properties:
          ordem:
            type: integer
            example: 1
    RotaInternaResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        paradas:
          type: array
          items:
            $ref: '#/components/schemas/RotaInternaParada'
    CreateMotoristaRequest:
      type: object
      required:
      - nome
      - cpf
      - senha
      - data_nasc
      - turno
      - municipio_trabalho_id
      - residencia
      properties:
        nome:
          type: string
          example: Joao Motorista
        cpf:
          type: string
          example: '00000000000'
        senha:
          type: string
          example: senha123
        telefone:
          type: string
          example: '82999990000'
        data_nasc:
          type: string
          format: date
          example: '1980-05-20'
        turno:
          type: string
          enum:
          - MT
          - VT
          - NT
          - IN
          example: NT
        municipio_trabalho_id:
          type: integer
          format: int64
          example: 2704302
        residencia:
          type: string
          example: campo alegre
        foto:
          type: string
          example: https://...
    UpdateMotoristaRequest:
      type: object
      properties:
        nome:
          type: string
          example: Joao Motorista
        cpf:
          type: string
          example: '00000000000'
        senha:
          type: string
          example: senha123
        telefone:
          type: string
          nullable: true
          description: Omitido/null preserva o valor atual; string vazia limpa o campo.
          example: '82999990000'
        data_nasc:
          type: string
          format: date
          example: '1980-05-20'
        turno:
          type: string
          enum:
          - MT
          - VT
          - NT
          - IN
          example: NT
        municipio_trabalho_id:
          type: integer
          format: int64
          example: 2704302
        residencia:
          type: string
          nullable: true
          description: Omitido/null preserva o valor atual; string vazia limpa o campo.
          example: campo alegre
        foto:
          type: string
          nullable: true
          description: Omitido/null preserva o valor atual; string vazia limpa o campo.
          example: https://...
    MotoristaResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: Joao Motorista
        cpf:
          type: string
          example: '00000000000'
        telefone:
          type: string
          example: '82999990000'
        data_nasc:
          type: string
          format: date
          example: '1980-05-20'
        turno:
          type: string
          enum:
          - MT
          - VT
          - NT
          - IN
          example: NT
        municipio_trabalho_id:
          type: integer
          format: int64
          example: 2704302
        residencia:
          type: string
          example: campo alegre
        foto:
          type: string
          example: https://...
    CreateClienteRequest:
      type: object
      required:
      - nome
      - cpf
      - senha
      - data_nasc
      properties:
        nome:
          type: string
          example: Maria Cliente
        cpf:
          type: string
          example: '11111111111'
        senha:
          type: string
          example: senha123
        telefone:
          type: string
          example: '82999991111'
        data_nasc:
          type: string
          format: date
          example: '2002-08-10'
        foto:
          type: string
          example: https://...
    UpdateClienteRequest:
      type: object
      properties:
        nome:
          type: string
          example: Maria Cliente
        cpf:
          type: string
          example: '11111111111'
        senha:
          type: string
          example: senha123
        telefone:
          type: string
          nullable: true
          description: Omitido/null preserva o valor atual; string vazia limpa o campo.
          example: '82999991111'
        data_nasc:
          type: string
          format: date
          example: '2002-08-10'
        foto:
          type: string
          nullable: true
          description: Omitido/null preserva o valor atual; string vazia limpa o campo.
          example: https://...
    ClienteResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: Maria Cliente
        cpf:
          type: string
          example: '11111111111'
        telefone:
          type: string
          example: '82999991111'
        data_nasc:
          type: string
          format: date
          example: '2002-08-10'
        foto:
          type: string
          example: https://...
    VinculoRequest:
      type: object
      required:
      - tipo
      - turno
      - destino_id
      - rota_interna_id
      - curso
      - validade
      properties:
        tipo:
          type: string
          enum:
          - estudante
          - estagio
          example: estudante
        turno:
          type: string
          enum:
          - MT
          - VT
          - NT
          - IN
          example: NT
        destino_id:
          type: integer
          example: 1
        rota_interna_id:
          type: integer
          example: 1
        curso:
          type: string
          example: Sistemas de Informacao
        comprovante:
          type: string
          example: https://...
        validade:
          type: string
          format: date
          example: '2026-12-31'
        horarios_fixos:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 5
          example:
          - 1
          - 2
          - 3
          - 4
          - 5
    VinculoHorarioFixo:
      type: object
      properties:
        id:
          type: integer
          example: 1
        vinculo_id:
          type: integer
          example: 10
        dia_semana:
          type: integer
          example: 1
    VinculoResponse:
      type: object
      properties:
        id:
          type: integer
          example: 10
        cliente_id:
          type: integer
          example: 1
        tipo:
          type: string
          enum:
          - estudante
          - estagio
          example: estudante
        turno:
          type: string
          enum:
          - MT
          - VT
          - NT
          - IN
          example: NT
        destino_id:
          type: integer
          example: 1
        rota_interna_id:
          type: integer
          example: 1
        curso:
          type: string
          example: Sistemas de Informacao
        comprovante:
          type: string
          example: https://...
        validade:
          type: string
          format: date
          example: '2026-12-31'
        horarios_fixos:
          type: array
          items:
            $ref: '#/components/schemas/VinculoHorarioFixo'
    VinculoComClienteResponse:
      allOf:
      - $ref: '#/components/schemas/VinculoResponse'
      - type: object
        properties:
          cliente_nome:
            type: string
            example: Maria Souza
    ClienteComVinculosResponse:
      allOf:
      - $ref: '#/components/schemas/ClienteResponse'
      - type: object
        properties:
          vinculos:
            type: array
            items:
              $ref: '#/components/schemas/VinculoResponse'
    CreateReservaRequest:
      type: object
      required:
      - data_viagem
      - sentido
      properties:
        data_viagem:
          type: string
          format: date
          example: '2026-06-10'
        turno:
          type: string
          enum:
          - MT
          - VT
          - NT
          example: NT
        sentido:
          type: string
          enum:
          - ida
          - volta
          example: ida
    UpdateReservaRequest:
      type: object
      properties:
        data_viagem:
          type: string
          format: date
          example: '2026-06-11'
        turno:
          type: string
          enum:
          - MT
          - VT
          - NT
          example: NT
        sentido:
          type: string
          enum:
          - ida
          - volta
          example: volta
        status:
          type: string
          enum:
          - confirmada
          - cancelada
          example: confirmada
    ReservaResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        cliente_id:
          type: integer
          example: 1
        vinculo_id:
          type: integer
          example: 10
        data_viagem:
          type: string
          format: date
          example: '2026-06-10'
        turno:
          type: string
          enum:
          - MT
          - VT
          - NT
          example: NT
        destino_id:
          type: integer
          example: 1
        rota_interna_id:
          type: integer
          example: 1
        sentido:
          type: string
          enum:
          - ida
          - volta
          example: ida
        status:
          type: string
          enum:
          - confirmada
          - cancelada
          example: confirmada
        created_at:
          type: string
          format: date-time
          example: '2026-06-06T20:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-06-06T20:00:00Z'
    ReservaComNomesResponse:
      allOf:
      - $ref: '#/components/schemas/ReservaResponse'
      - type: object
        properties:
          cliente_nome:
            type: string
            example: Maria Souza
          destino_nome:
            type: string
            example: Campus A
    ReservaListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReservaComNomesResponse'
        next_cursor:
          type: string
          description: Opaco. So presente quando has_more e true.
          example: MjAyNi0wNi0xMHwx
        has_more:
          type: boolean
    DisponibilidadeReservaResponse:
      type: object
      required:
      - data_viagem
      - turno
      - sentido
      - partida_em
      - fechamento_em
      - consultado_em
      - disponivel
      properties:
        data_viagem:
          type: string
          format: date
          example: '2026-06-10'
        turno:
          type: string
          enum: [MT, VT, NT]
          example: NT
        sentido:
          type: string
          enum: [ida, volta]
          example: ida
        partida_em:
          type: string
          format: date-time
          example: '2026-06-10T17:00:00-03:00'
        fechamento_em:
          type: string
          format: date-time
          example: '2026-06-10T16:30:00-03:00'
        consultado_em:
          type: string
          format: date-time
          example: '2026-06-10T15:40:00-03:00'
        disponivel:
          type: boolean
          example: true
    HorarioTurnoViagemRequest:
      type: object
      required:
      - municipio_destino_id
      - turno
      - horario_ida
      - horario_volta
      properties:
        municipio_destino_id:
          type: integer
          format: int64
          example: 2704302
        turno:
          type: string
          enum:
          - MT
          - VT
          - NT
          example: NT
        horario_ida:
          type: string
          example: '17:00'
        horario_volta:
          type: string
          example: '22:00'
    HorarioTurnoViagemResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        municipio_destino_id:
          type: integer
          format: int64
          example: 2704302
        turno:
          type: string
          enum:
          - MT
          - VT
          - NT
          example: NT
        horario_ida:
          type: string
          example: '17:00:00'
        horario_volta:
          type: string
          example: '22:00:00'
        created_at:
          type: string
          format: date-time
          example: '2026-06-06T20:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-06-06T20:00:00Z'
    CicloViagemResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        data_viagem:
          type: string
          format: date
          example: '2026-06-10'
        turno:
          type: string
          enum:
          - MT
          - VT
          - NT
          example: NT
        municipio_destino_id:
          type: integer
          format: int64
          example: 2704302
        rota_interna_id:
          type: integer
          example: 1
        veiculo_id:
          type: integer
          example: 1
        motorista_id:
          type: integer
          example: 1
        status:
          type: string
          enum:
          - planejado
          - em_andamento
          - concluido
          - cancelado
          example: planejado
        expires_at:
          type: string
          format: date-time
          example: '2026-09-10T00:00:00Z'
        created_at:
          type: string
          format: date-time
          example: '2026-06-06T20:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-06-06T20:00:00Z'
    ViagemResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        ciclo_viagem_id:
          type: integer
          example: 1
        sentido:
          type: string
          enum:
          - ida
          - volta
          example: ida
        status:
          type: string
          enum:
          - programada
          - em_andamento
          - concluida
          - cancelada
          example: programada
        created_at:
          type: string
          format: date-time
          example: '2026-06-06T20:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-06-06T20:00:00Z'
    ViagemComCicloResponse:
      type: object
      properties:
        viagem:
          $ref: '#/components/schemas/ViagemResponse'
        ciclo:
          $ref: '#/components/schemas/CicloViagemResponse'
    ResumoProcessamentoPlanejamentoResponse:
      type: object
      required:
      - candidatos
      - devidos
      - adquiridos
      - concluidos
      - sem_demanda
      - falhos
      properties:
        candidatos:
          type: integer
          example: 4
        devidos:
          type: integer
          example: 2
        adquiridos:
          type: integer
          example: 2
        concluidos:
          type: integer
          example: 2
        sem_demanda:
          type: integer
          example: 0
        falhos:
          type: integer
          example: 0
    ExecucaoPlanejamentoFalhaResponse:
      type: object
      required:
      - id
      - data_viagem
      - turno
      - municipio_destino_id
      - rota_interna_id
      - sentido
      - partida_em
      - fechamento_em
      - status
      - tentativas
      properties:
        id:
          type: integer
          format: int64
          example: 7
        data_viagem:
          type: string
          format: date
          example: '2026-08-12'
        turno:
          type: string
          enum:
          - MT
          - VT
          - NT
        municipio_destino_id:
          type: integer
          format: int64
          example: 2704302
        rota_interna_id:
          type: integer
          format: int64
          example: 3
        sentido:
          type: string
          enum:
          - ida
          - volta
        partida_em:
          type: string
          format: date-time
        fechamento_em:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - falhou
        tentativas:
          type: integer
          example: 2
        ultimo_erro:
          type: string
          nullable: true
          example: vehicles unavailable
        proxima_tentativa_em:
          type: string
          format: date-time
          nullable: true
        finalizado_em:
          type: string
          format: date-time
          nullable: true
    ViagemHorarioResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        viagem_id:
          type: integer
          example: 1
        tipo:
          type: string
          enum:
          - partida_prevista
          - inicio_real
          - fim_real
          example: partida_prevista
        horario:
          type: string
          format: date-time
          example: '2026-06-10T17:00:00Z'
        created_at:
          type: string
          format: date-time
          example: '2026-06-06T20:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-06-06T20:00:00Z'
    AtualizarPresencaRequest:
      type: object
      required:
      - status_presenca
      properties:
        status_presenca:
          type: string
          enum:
          - embarcou
          - faltou
          - cancelado
