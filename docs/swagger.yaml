              schema:
                $ref: '#/components/schemas/AdminResponse'
      parameters:
      - name: adminID
        in: path
        required: true
        schema:
          type: integer
  /admin/senha:
    put:
      summary: Troca a senha do proprio admin autenticado
      description: >-
        O admin alvo vem do JWT, nunca do corpo ou do path. A senha atual e exigida
        para que uma sessao roubada nao consiga tomar a conta de vez. Em caso de
        sucesso o cookie de sessao e reemitido.
      tags:
      - Admin
      responses:
        '204':
          description: Senha trocada, cookie de sessao reemitido
        '400':
          description: Corpo invalido ou nova senha com menos de 8 caracteres
        '403':
          description: Senha atual incorreta
        '429':
          description: Tentativas demais
