  # Criar, alterar e remover admin nao tem endpoint: essas operacoes vivem em
  # cmd/admin, que exige acesso direto ao banco. Com uma unica role de admin, expor
  # isso por HTTP deixaria qualquer sessao roubada fabricar os proprios acessos.
  /admin/:
    get:
      summary: Lista admins
      tags:
      - Admin
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminResponse'
